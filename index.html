<link rel="preload" href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Inter;src:url('https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--bg:#0d0a22;--ink:#180f3c;--pink:#f2b8c0;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,Arial,sans-serif;color:#fff}body{min-height:520px}.hero{position:relative;width:100%;height:100svh;min-height:520px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 65%,#35224d 0,#15102f 44%,#0d0a22 100%)}
.stage{position:absolute;width:max(100vw,calc(100svh * 16 / 9));height:auto;aspect-ratio:16/9;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden}
.back,.mid,.front,.headline{position:absolute;inset:0}.back{z-index:0;transform-origin:50% 40%}.back img,.mid img,.front img,.opening img,.opening video{width:100%;height:100%;position:absolute;inset:0;object-fit:cover}.back-base{filter:saturate(.92) brightness(.88)}.rain{opacity:0;transition:opacity .7s linear}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,8,40,.48),transparent 45%);opacity:0;pointer-events:none}.headline{z-index:1;inset:auto 0 auto;top:43%;transform:translateY(6%);text-align:center;pointer-events:none}.kicker{font-size:clamp(14px,1.7vw,34px);font-weight:300;letter-spacing:-.01em;margin:0 0 -.02em;opacity:0;transform:translateY(.5em)}h1{font-size:clamp(78px,19vw,290px);font-weight:700;line-height:.88;letter-spacing:-.065em;margin:0;white-space:nowrap;text-shadow:0 8px 50px rgba(0,0,0,.12)}h1 span{display:inline-block;opacity:0;transform:translateY(.14em)}
.mid{z-index:2;transform-origin:50% 45%;pointer-events:none}.mid img{object-fit:cover}.front{z-index:3;transform-origin:50% 100%;transform:translateY(66%);pointer-events:none}.glass{position:absolute;left:5.2%;right:4.1%;top:57.9%;height:25.4%;background:linear-gradient(180deg,rgba(190,200,255,.10),rgba(150,160,230,.05) 60%,rgba(120,130,210,.08));backdrop-filter:blur(1.2px) saturate(1.05);border-top:1px solid rgba(255,255,255,.18)}.portrait{position:absolute;bottom:-1%;left:50%;height:77%;width:auto;max-width:110%;object-fit:contain;object-position:center bottom;transform:translateX(-50%);filter:drop-shadow(0 12px 34px rgba(0,0,0,.3))}
.nav{position:absolute;z-index:8;top:52px;left:0;right:0;padding:0 max(32px,8.68vw);height:48px;display:flex;align-items:center;justify-content:space-between;opacity:0;transform:translateY(-6px)}.brand{font-size:17px;font-weight:600;letter-spacing:.28em;color:#fff;text-decoration:none;white-space:nowrap}.pill{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:5px;border:1px solid rgba(255,255,255,.12);border-radius:99px;background:rgba(255,255,255,.14);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.035);white-space:nowrap}.pill a{height:38px;padding:0 22px;display:flex;align-items:center;justify-content:center;border-radius:99px;text-decoration:none;color:rgba(255,255,255,.88);font-size:15px;font-weight:400;transition:background .25s,color .25s}.pill a:hover{background:rgba(255,255,255,.14);color:#fff}.pill a.active{background:#fff;color:var(--ink);font-weight:600}.right{display:flex;align-items:center;gap:30px}.lang{display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.9);font-size:14px}.lang svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.5}.cta{height:44px;padding:0 27px;border-radius:99px;background:var(--pink);color:var(--ink);font-size:15px;font-weight:600;text-decoration:none;display:flex;align-items:center;transition:transform .2s,background .2s}.cta:hover{transform:translateY(-1px);background:#f7c9d0}
.opening{position:absolute;inset:0;z-index:6;opacity:1}.opening img,.opening video{object-fit:cover}.opening video{opacity:0}.doors{position:absolute;inset:0;z-index:7;display:flex}.door{width:50%;height:100%;background-image:url('https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261117_063048_97fd9a70-adbe-46bd-bfce-ec1004f6c7d8.png&w=2000&q=85');background-size:200% 100%;background-repeat:no-repeat}.door.left{background-position:0 50%}.door.right{background-position:100% 50%}
.hero.ready .nav{animation:navIn .35s 2.45s both}.hero.ready .kicker{animation:kickerIn .65s 2.45s both}.hero.ready h1 span{animation:letterIn .7s both}.hero.ready h1 span:nth-child(1){animation-delay:2.45s}.hero.ready h1 span:nth-child(2){animation-delay:2.504s}.hero.ready h1 span:nth-child(3){animation-delay:2.558s}.hero.ready h1 span:nth-child(4){animation-delay:2.612s}.hero.ready h1 span:nth-child(5){animation-delay:2.666s}.hero.ready h1 span:nth-child(6){animation-delay:2.72s}.hero.ready .headline{animation:headlineRise 1.8s 3s both}.hero.ready .back{animation:backDrift 1.4s 2.9s both}.hero.ready .mid{animation:cityDrift 4s 2.9s both}.hero.ready .front{animation:portraitRise 3.95s 3.35s cubic-bezier(.2,.5,.2,1) both}.hero.ready .shade{animation:shadeIn .8s 2.9s both}.hero.ready .opening{animation:openingOut .5s 2.45s both}.hero.ready .door.left{animation:doorLeft 1.11s .02s cubic-bezier(.1,.2,.8,1) both}.hero.ready .door.right{animation:doorRight 1.22s .02s cubic-bezier(.4,.6,.9,1) both}
@keyframes doorLeft{to{transform:translateX(-101%)}}@keyframes doorRight{to{transform:translateX(101%)}}@keyframes openingOut{to{opacity:0;visibility:hidden}}@keyframes navIn{to{opacity:1;transform:translateY(0)}}@keyframes kickerIn{to{opacity:1;transform:translateY(0)}}@keyframes letterIn{to{opacity:1;transform:translateY(0)}}@keyframes headlineRise{to{transform:translateY(0)}}@keyframes backDrift{to{transform:translateY(-1.5%)}}@keyframes cityDrift{0%,35%{transform:translateY(-4%)}100%{transform:translateY(0)}}@keyframes portraitRise{0%{transform:translateY(66%)}68%{transform:translateY(-2.5%)}100%{transform:translateY(0)}}@keyframes shadeIn{to{opacity:1}}
@media(max-width:820px){.nav{top:16px;height:auto;padding:0 18px;display:grid;grid-template-columns:1fr auto;row-gap:12px}.brand{font-size:14px;letter-spacing:.22em}.right{gap:14px}.lang{font-size:13px;gap:6px}.lang svg{width:16px;height:16px}.cta{height:36px;padding:0 16px;font-size:13px}.pill{position:relative;left:auto;transform:none;grid-column:1/-1;width:100%;height:40px;gap:3px;padding:4px;justify-content:space-between}.pill a{height:32px;flex:1;padding:0 10px;font-size:12px}.headline{top:36.2%}h1{font-size:clamp(76px,20vw,170px)}.kicker{font-size:clamp(13px,3vw,20px)}.portrait{height:78%;max-width:125%}}
@media(max-width:360px){.pill a{font-size:11px;padding:0 6px}.nav{padding:0 12px}.right{gap:9px}}
@media(max-height:500px) and (orientation:landscape){.nav{top:12px;padding:0 24px;height:34px;display:flex}.brand{font-size:13px}.pill{height:34px;gap:0;padding:3px}.pill a{height:28px;padding:0 12px;font-size:12px}.right{gap:18px}.lang{font-size:12px}.cta{height:32px;padding:0 18px;font-size:12px}.headline{top:43%}h1{font-size:min(18vw,190px)}.portrait{height:75%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.nav{opacity:1;transform:none}.kicker,h1 span{opacity:1;transform:none}.front{transform:none}.opening,.doors{display:none}.shade{opacity:1}.rain{display:none}}
</style></head>
<body><main class="hero" id="hero">
  <div class="stage">
    <div class="back" id="back"><img class="back-base" src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261117_063251_24fbd7cc-00df-49ec-8fbf-d8a0349b1e98.png&w=2000&q=85" alt="Stormy violet harbour sky"><video class="rain" id="rainA" muted playsinline preload="auto" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261117_063703_04e54df7-2236-4dff-b95b-a9a34c1f78ec.mp4"></video><video class="rain" id="rainB" muted playsinline preload="auto" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261117_063703_04e54df7-2236-4dff-b95b-a9a34c1f78ec.mp4"></video><div class="shade"></div></div>
    <div class="headline"><p class="kicker">Claim Your</p><h1 aria-label="Yamen"><span>Y</span><span>a</span><span>m</span><span>e</span><span>n</span></h1></div>
    <div class="mid"><img src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261117_063252_b9f2fecf-9be0-485f-842f-3aa6bbc251f2.png&w=2000&q=85" alt="Neon harbour skyline"></div>
    <div class="front"><div class="glass"></div><img class="portrait" src="yamen.png" alt="Yamen Al Jamous"></div>
  </div>
  <nav class="nav" aria-label="Main navigation"><a class="brand" href="#home">YAMEN</a><div class="pill"><a class="active" href="#home">Home</a><a href="https://www.linkedin.com/in/eamen-al-jamous-b05b88347/" target="_blank" rel="noreferrer">About</a><a href="https://github.com/Yamen0099" target="_blank" rel="noreferrer">Focus</a><a href="https://www.linkedin.com/in/eamen-al-jamous-b05b88347/" target="_blank" rel="noreferrer">Contact</a></div><div class="right"><div class="lang"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M2.8 12h18.4M12 2.8c2.6 2.5 3.8 5.6 3.8 9.2s-1.2 6.7-3.8 9.2c-2.6-2.5-3.8-5.6-3.8-9.2S9.4 5.3 12 2.8z"/></svg>Eng</div><a class="cta" href="https://www.linkedin.com/in/eamen-al-jamous-b05b88347/" target="_blank" rel="noreferrer">Connect</a></div></nav>
  <div class="opening" id="opening"><img src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261117_063055_ee1debcd-d200-484f-b94f-fad6dcffd4eb.png&w=2000&q=85" alt="Aerial rooftop at night"><video id="tilt" muted playsinline preload="auto" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261117_063355_a600befc-45d6-4a32-9db6-9d6565a89609.mp4"></video></div>
  <div class="doors"><div class="door left"></div><div class="door right"></div></div>
</main>
<script>
(()=>{
 const hero=document.getElementById('hero'), tilt=document.getElementById('tilt'), opening=document.getElementById('opening');
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const images=[...document.querySelectorAll('.stage img'),...document.querySelectorAll('.door')];
 const waitImage=el=>new Promise(resolve=>{if(el.complete&&el.naturalWidth)return resolve();el.addEventListener('load',resolve,{once:true});el.addEventListener('error',resolve,{once:true});setTimeout(resolve,2600)});
 const waitVideo=el=>new Promise(resolve=>{if(el.readyState>=3)return resolve();el.addEventListener('canplaythrough',resolve,{once:true});el.addEventListener('error',resolve,{once:true});setTimeout(resolve,4200)});
 function startRain(){const a=document.getElementById('rainA'),b=document.getElementById('rainB');let active=a,next=b,swapping=false;const play=async(v)=>{try{v.currentTime=0;await v.play();v.style.opacity='1'}catch(e){}};play(active);active.addEventListener('timeupdate',()=>{if(swapping||active.currentTime<2.85)return;swapping=true;play(next);active.style.opacity='0';const old=active;active=next;next=old;setTimeout(()=>{old.pause();old.currentTime=0;swapping=false},800)})}
 if(reduced){hero.classList.add('ready');opening.style.display='none';document.querySelector('.doors').style.display='none';return}
 const boot=()=>{hero.classList.add('ready');startRain();try{tilt.currentTime=0;tilt.playbackRate=3.13;tilt.play();setTimeout(()=>{tilt.pause();tilt.currentTime=tilt.duration||5},1600)}catch(e){}};
 let launched=false;const launch=()=>{if(launched)return;launched=true;boot()};
 Promise.all([...images.map(waitImage),waitVideo(tilt)]).then(()=>setTimeout(launch,120));setTimeout(launch,5000);
})();
</script></body></html>
